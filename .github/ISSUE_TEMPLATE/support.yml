name: App support or feature request
description: Report a problem or suggest an improvement without sharing personal data.
title: ""
body:
  - type: markdown
    attributes:
      value: "Reports are public. Do not include shift notes, pay details, backup files or contact information."
  - type: textarea
    id: description
    attributes:
      label: What happened, or what would you like to improve?
      description: Include the steps to reproduce a problem and the behavior you expected.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: App version, iOS version and device model
      placeholder: Shift Calendar 1.0, iOS 26, iPad Pro
